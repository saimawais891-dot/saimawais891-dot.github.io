<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LORVÉN Admin</title>

<style>
:root{--green:#123c2b;--gold:#c9a86a;--cream:#f8f4ec;--ink:#17221c;--line:#ded7ca}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--green);color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Georgia,serif;letter-spacing:4px;font-size:22px}
.tag{color:#e8d2a2;font-size:10px;letter-spacing:3px}
button{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--green);color:#fff}
.gold{background:#a88442}
.danger{background:#8f2929}
.wrap{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-top:6px}
textarea{min-height:100px}
label{display:block;font-size:13px;font-weight:bold;margin-top:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notice{background:#fff7df;border:1px solid #e7d19a;padding:12px;border-radius:12px;margin-bottom:15px}
.product{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}
.product img{width:65px;height:65px;object-fit:cover;border-radius:10px;background:#eee}
.muted{color:#68736d;font-size:13px}
#adminPanel{display:none}
#loginBox{max-width:430px;margin:60px auto}
@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:12px}}
  /* ===== LORVÉN PREMIUM DASHBOARD ===== */

body{
  background:
    radial-gradient(circle at top right, rgba(201,168,106,.12), transparent 35%),
    #f6f2e9;
}

header{
  background:linear-gradient(135deg,#0d3022,#174b35);
  padding:22px 24px;
  box-shadow:0 8px 30px rgba(18,60,43,.15);
}

.logo{
  font-family:Georgia,serif;
  font-size:26px;
  letter-spacing:5px;
}

.tag{
  margin-top:4px;
  color:#d9bd82;
  letter-spacing:4px;
  font-size:10px;
}

.wrap{
  max-width:1150px;
  padding:24px;
}

.card{
  background:rgba(255,255,255,.94);
  border:1px solid rgba(201,168,106,.25);
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 12px 35px rgba(23,34,28,.07);
}

.card h2{
  font-family:Georgia,serif;
  color:#123c2b;
  margin-top:0;
  letter-spacing:.3px;
}

button{
  border-radius:12px;
  padding:13px 18px;
  font-weight:600;
  transition:.2s ease;
}

button:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 18px rgba(18,60,43,.15);
}

.gold{
  background:linear-gradient(135deg,#b28b4a,#d7b875);
  color:white;
}

input,textarea{
  background:#fffdf9;
  border:1px solid #ddd3c2;
  transition:.2s ease;
}

input:focus,textarea:focus{
  outline:none;
  border-color:#c9a86a;
  box-shadow:0 0 0 3px rgba(201,168,106,.12);
}

.notice{
  background:linear-gradient(135deg,#fffaf0,#f8f1df);
  border:1px solid #e4cf9e;
  border-radius:16px;
  box-shadow:0 8px 22px rgba(80,60,25,.06);
}

.product{
  padding:16px 4px;
}

.product img{
  width:72px;
  height:72px;
  border-radius:14px;
  box-shadow:0 5px 15px rgba(0,0,0,.10);
}

/* Dashboard statistics */

.dash-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat-card{
  background:linear-gradient(145deg,#ffffff,#faf7f0);
  border:1px solid rgba(201,168,106,.28);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 28px rgba(23,34,28,.06);
}

.stat-label{
  color:#68736d;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin-bottom:8px;
}

.stat-value{
  color:#123c2b;
  font-family:Georgia,serif;
  font-size:28px;
  font-weight:bold;
}

@media(max-width:800px){
  .dash-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .wrap{
    padding:14px;
  }

  header{
    padding:18px;
  }

  .logo{
    font-size:22px;
  }

  .card{
    padding:17px;
    border-radius:17px;
  }

  .dash-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{
    padding:16px;
  }

  .stat-value{
    font-size:23px;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <div class="logo">LORVÉN</div>
    <div class="tag">TIMELESS LUXURY</div>
  </div>
  <button id="logoutBtn" onclick="logout()" style="display:none">Logout</button>
</header>

<div id="loginBox" class="card">
  <h2>Admin Login</h2>

  <label>Email</label>
  <input id="email" type="email" placeholder="Admin email">

  <label>Password</label>
  <input id="password" type="password" placeholder="Password">

  <br><br>
  <button onclick="login()">Login</button>

  <p id="loginMessage" class="muted"></p>
</div>

<main id="adminPanel" class="wrap">
<section class="dash-grid" aria-label="Dashboard overview">

  <div class="stat-card">
    <div class="stat-label">Total Products</div>
    <div id="statProducts" class="stat-value">0</div>
  </div>

  <div class="stat-card">
    <div class="stat-label">In Stock</div>
    <div id="statStock" class="stat-value">0</div>
  </div>

  <div class="stat-card">
    <div class="stat-label">Low Stock</div>
    <div id="statLow" class="stat-value">0</div>
  </div>

  <div class="stat-card">
    <div class="stat-label">Catalog Value</div>
    <div id="statValue" class="stat-value">Rs. 0</div>
  </div>

</section>
  <div class="notice">
    <b>LORVÉN Admin Control Panel</b><br>
    Products are connected to Supabase.
  </div>

  <div class="card">
    <h2>Add Product</h2>

    <div class="row">
      <div>
        <label>Product name</label>
        <input id="pname" placeholder="LORVÉN Signature">
      </div>

      <div>
        <label>Price (Rs.)</label>
        <input id="pprice" type="number" placeholder="3999">
      </div>
    </div>

    <label>Image URL</label>
    <input id="pimage" type="file" accept="image/*">

    <label>Description</label>
    <textarea id="pdesc" placeholder="Product description"></textarea>

    <label>Category</label>
    <input id="pcat" placeholder="Signature Collection">

    <br><br>
    <button class="gold" onclick="addProduct()">Save Product</button>

    <p id="saveMessage" class="muted"></p>
  </div>

  <div class="card">
    <h2>Products</h2>
    <div id="productList">Loading products...</div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://bexqjshygqmbgatawsni.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9eSjTgI-z6xkQRyd4pw8Vg_-FjHaUsW";

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storage: window.localStorage
  }
});

async function checkLogin(){
  const {data}=await supabaseClient.auth.getSession();

  if(data.session){
    showAdmin();
  }else{
    showLogin();
  }
}

function showLogin(){
  document.getElementById("loginBox").style.display="block";
  document.getElementById("adminPanel").style.display="none";
  document.getElementById("logoutBtn").style.display="none";
}

function showAdmin(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("adminPanel").style.display="block";
  document.getElementById("logoutBtn").style.display="block";
  loadProducts();
}

async function login(){

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const message=document.getElementById("loginMessage");

  if(!email || !password){
    message.textContent="Please enter email and password.";
    return;
  }

  message.textContent="Logging in...";

  const {error}=await supabaseClient.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){
    message.textContent="Login failed: "+error.message;
    return;
  }

  message.textContent="";
  showAdmin();
}

async function logout(){
  await supabaseClient.auth.signOut();
  showLogin();
}

async function loadProducts(){
  const statProducts = document.getElementById("statProducts");
  const statStock = document.getElementById("statStock");
  const statLow = document.getElementById("statLow");
  const statValue = document.getElementById("statValue");
  const list=document.getElementById("productList");
  list.innerHTML="Loading products...";

  const {data,error}=await supabaseClient
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    list.innerHTML="<p>Could not load products.</p>";
    console.error(error);
    return;
  }
statProducts.textContent = data.length;

const inStock = data.filter(p => Number(p.stock) > 0).length;

const lowStock = data.filter(
  p => Number(p.stock) > 0 && Number(p.stock) <= 5
).length;

const catalogValue = data.reduce((total, p) => {
  return total + (Number(p.price) * Number(p.stock || 0));
}, 0);

statStock.textContent = inStock;
statLow.textContent = lowStock;
statValue.textContent = "Rs. " + catalogValue.toLocaleString();
  if(!data || data.length===0){
    list.innerHTML='<p class="muted">No products yet.</p>';
    return;
  }

  list.innerHTML=data.map(product=>`
    <div class="product">

      <img
        src="${product.image_url || ''}"
        onerror="this.style.display='none'"
      >

      <div style="flex:1">
        <b>${escapeHtml(product.name)}</b>

        <div class="muted">
          Rs. ${product.price || 0}
          · ${escapeHtml(product.category || "Uncategorized")}
        </div>
      </div>

      <button
        class="danger"
        onclick="deleteProduct('${product.id}')"
      >
        Delete
      </button>

    </div>
  `).join("");
}
async function uploadProductImage(file) {
  if (!file) return null;

  const fileName =
    Date.now() + "-" +
    file.name.replace(/[^a-zA-Z0-9.-]/g, "-");

  const { error } = await supabaseClient
    .storage
    .from("product-images")
    .upload(fileName, file);

  if (error) {
    throw error;
  }

  const { data } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(fileName);

  return data.publicUrl;
}

async function addProduct(){


  const name=document.getElementById("pname").value.trim();
  const price=Number(document.getElementById("pprice").value || 0);
  const imageFile=document.getElementById("pimage").files[0];
  const description=document.getElementById("pdesc").value.trim();
  const category=document.getElementById("pcat").value.trim();
  const message=document.getElementById("saveMessage");

  if(!name){
    message.textContent="Please enter product name.";
    return;
  }

  message.textContent="Saving...";
let image_url = null;

if (imageFile) {
  message.textContent = "Uploading image...";

  try {
    image_url = await uploadProductImage(imageFile);
  } catch (error) {
    message.textContent = "Image upload failed: " + error.message;
    return;
  }
}
  const {error}=await supabaseClient
    .from("products")
    .insert([{
      name:name,
      price:price,
      image_url:image_url,
      description:description,
      category:category,
      stock:0
    }]);

  if(error){
    message.textContent="Error: "+error.message;
    console.error(error);
    return;
  }

  document.getElementById("pname").value="";
  document.getElementById("pprice").value="";
  document.getElementById("pimage").value="";
  document.getElementById("pdesc").value="";
  document.getElementById("pcat").value="";

  message.textContent="Product saved successfully!";
  loadProducts();
}

async function deleteProduct(id){

  if(!confirm("Delete this product?")) return;

  const {error}=await supabaseClient
    .from("products")
    .delete()
    .eq("id",id);

  if(error){
    alert("Delete failed: "+error.message);
    return;
  }

  loadProducts();
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

checkLogin();
</script>

</body>
</html>
